<!DOCTYPE html><!-- <!DOCTYPE html> 文档类型声明，告诉浏览器这是一个 HTML5 文档-->
<!--<html> 标签是 HTML 文档的根元素，所有其他内容都嵌套在它内部。lang="en" 表示页面的主要语言是英语（English）。如果页面使用中文，可以改为 lang="zh"。 -->
<html lang="en">
<!-- <head> 标签包含页面的元信息（metadata）指定字符编码为 UTF-8
用于优化移动端显示。
width=device-width：设置页面宽度等于设备屏幕宽度。
initial-scale=1.0：设置页面初始缩放比例为 1。
<title>Flask 页面</title> 定义网页的标题，显示在浏览器标签页上-->
<head>
    <meta charset="UTF-8"> <!-- 设置文档字符编码为UTF-8 -->
    <title>答题系统</title> <!-- 设置网页标题 -->
    <!-- <link> 是 HTML 标签，用于引入外部资源， rel="stylesheet" 指定引入的资源类型为样式表（CSS）
     href="..."指定外部 CSS 文件的路径， {，{，}，}里面的内容（正常打印会报错） 动态生成 CSS 文件的路径 ，url_for() 是 Flask 提供的一个函数，用于生成静态资源或路由的 URL
     'static'：表示要引用的是 Flask 的静态文件目录（默认为 static 文件夹）。filename='style.css'：指定要引用的文件名（这里是 style.css），所以所有格式的内容都可以放到css
     url_for('static', filename='style.css') 的生成结果为：/static/style.css-->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body> <!--<body> 标签定义了网页的主体内容，用户可以直接看到的部分 -->
<header> <!--其格式在css里面的header里面 或者 使用普通的 <div> 标签，并通过 CSS 来设置样式。例如 <div class="sidebar">-->
    答题系统 <!-- 页面头部标题 -->
</header>

<!-- 这是一个容器（container），通常用于包裹整个页面的内容，class="container" 是一个 CSS 类名，通常在样式表中定义了这个类的样式（例如宽度、边距等） -->
<div class="container">
    <div class="sidebar"> <!--class="sidebar" 表示这是一个侧边栏的样式类，可以通过 CSS 来定义它的外观和位置   -->
        <!-- 按钮元素（button），用户可以点击它来触发某些功能,id="categoryBtn": 给按钮指定了一个唯一的 ID（categoryBtn），用于在 JavaScript 或 CSS 中唯一标识这个按钮 -->
        <!--class="sidebar-button": 指定了按钮的样式类，通常在 CSS 中定义了按钮的外观（例如背景颜色、字体大小等,题目分类: 这是按钮上显示的文字内容，表示按钮的功能或用途 -->
        <button id="categoryBtn" >题目分类</button> <!-- 题目分类按钮 -->
        <button id="addQuestionBtn" >录题</button> <!-- 录题按钮 -->
        <button id="challengeRecordBtn" >挑战记录</button> <!-- 挑战记录按钮 -->
        <button id="wrongRecordBtn" >错题记录</button> <!-- 错题记录按钮 -->
        <button id="analysisBtn" >综合分析</button> <!-- 错题记录按钮 -->
    </div>

    <div class="content" id="contentArea">
        <div id="defaultMessage"> <!-- 一个子容器，用于显示默认的消息内容 指定了一个唯一的 ID-->
            <h1>菜鸡语录！</h1> <!-- 默认消息标题 一级标题（h1），用于显示页面的主标题-->
            <p>请点击左侧的“题目分类”或“录题”按钮 开始操作。</p> <!-- 默认消息内容 -->
        </div>

        <!-- class="hidden" 表示这个容器默认是隐藏的（通常通过 CSS 定义 .hidden { display: none; }）-->
        <div id="dynamicContent" >
            <div class="right-content"> <!--个右侧内容区域的容器，可能用于布局页面的右侧部分 -->
                <div class="right-column" id="categoryColumn"> <!-- 更具体的容器，用于显示“题目分类”相关的内容 -->
                    <h2>题目分类</h2> <!-- 这是一个二级标题，表示这部分内容的主题是“题目分类” -->
                    <div class="category-list"> <!-- category-list 可以没有该样式-->
                        {% for category in categories %} <!--一个容器，遍历 categories 列表中的每个分类的分类按钮 categoriesapp.py中以及定义-->
                        <!-- class="category-btn": 指定按钮的样式类,data-category 一个自定义属性，用于存储分类的名称 动态设置按钮的背景颜色，颜色值从 category_colors 字典中获取。category_colors 是一个映射分类名称到颜色的字典（例如 {"数学":
                         "red", "英语": "blue", "物理": "green"} data-category 属性，存储了分类的名称可以通过JavaScript 监听按钮的点击事件，获取分类名称并执行相应操作。-->
                        <button class="category-btn" data-category="{{ category }}" style="background-color: {{ category_colors[category] }};"> <!-- 循环生成每个类别的按钮 -->
                            {{ category }} <!--显示分类的名称（如 数学） -->
                        </button>
                        {% endfor %}
                    </div>
                </div>

                <div class="right-column" id="difficultyColumn" >
                    <h2 id="difficultyTitle">难度等级</h2> <!-- 难度等级标题 -->
                    <div class="difficulty-list">
                        <button class="difficulty-btn" data-difficulty="all">不区分难度</button> <!-- 不区分难度按钮 -->
                        <button class="difficulty-btn" data-difficulty="easy">容易</button> <!-- 容易难度按钮 -->
                        <button class="difficulty-btn" data-difficulty="medium">简单</button> <!-- 简单难度按钮 -->
                        <button class="difficulty-btn" data-difficulty="hard">困难</button> <!-- 困难难度按钮 -->
                    </div>
                </div>
            </div>
        </div>

        <div id="addQuestionForm" class="hidden">
            <h3>录入新题目</h3> <!-- 录题表单标题 -->
            <!-- method="POST": 指定表单的提交方式为 POST 方法（适合提交敏感数据或需要保存的数据）。
            action="/add_question": 指定表单提交的目标 URL（即后端处理表单数据的接口地址）。-->
            <form id="questionForm" method="POST" action="/add_question"> <!-- 录题表单 -->
                <div id="message"></div> <!-- 消息显示区域 这是一个消息显示区域，用于动态显示提示信息（例如成功消息、错误消息等）-->
                <!--通过 JavaScript 动态更新其内容，例如：document.getElementById('message').innerHTML = '<p style="color: green;">题目提交成功！</p>';-->
                <div style="margin-bottom: 10px;"> <!--这是一个容器，用于包裹标签和输入框，并添加一些样式（如底部外边距 margin-bottom: 10px;） -->
                    <label class="left-aligned-label">1、题目内容：</label> <!-- 标签 -->
                    <!--input type="text":这是一个文本输入框，允许用户输入内容 指定输入框的类型为文本输入框,name="question_text": 指定输入框的名称，后端可以通过这个名称获取用户输入的内容。
                     value="": 初始值为空，表示输入框在页面加载时没有预设内容,required: 表示这个输入框是必填项，如果用户未填写内容，则无法提交表单
                     autocomplete="off"禁用浏览器的自动填充功能,-->
                    <input type="text" name="question_text" value="" required style="width: 100%; padding: 5px;" autocomplete="off"> <!-- 输入框 -->
                </div>
                <div style="margin-bottom: 10px;">
                    <label class="left-aligned-label">2、选项（格式：A.北京 B.天津 C.长沙 D.广州）：</label> <!-- 用于描述输入框的用途 -->
                    <input type="text" name="options" value="" required style="width: 100%; padding: 5px;" autocomplete="off"> <!-- 输入框 -->
                </div>
                <div style="margin-bottom: 10px;">
                    <label class="left-aligned-label">3、正确答案（如：A）：</label> <!-- 标签 -->
                    <input type="text" name="correct_answer" list="answerList" value="" required style="width: 100%; padding: 5px;" autocomplete="on"> <!-- 输入框 -->
                    <datalist id="answerList">
                        <option value="A"> <!-- 正确答案选项A -->
                        <option value="B"> <!-- 正确答案选项B -->
                        <option value="C"> <!-- 正确答案选项C -->
                        <option value="D"> <!-- 正确答案选项D -->
                    </datalist>
                </div>
                <div style="margin-bottom: 10px;">
                    <label class="left-aligned-label">4、难度等级（如：easy, medium, hard）：</label> <!-- 标签 -->
                    <!--list="difficultyList" 关联到 <datalist> 元素的 id（即 difficultyList），提供一组预定义的选项供用户选择-->
                    <input type="text" name="difficulty" list="difficultyList" value="" required style="width: 100%; padding: 5px;" autocomplete="on"> <!-- 输入框 -->
                    <!--id="difficultyList" 是它的唯一标识符，与 <input> 的 list 属性关联  每个 <option> 元素的 value 属性定义了选项的具体值-->
                    <datalist id="difficultyList">
                        <option value="easy"> <!-- 难度等级选项easy -->
                        <option value="medium"> <!-- 难度等级选项medium -->
                        <option value="hard"> <!-- 难度等级选项hard -->
                    </datalist>
                </div>
                <div style="margin-bottom: 10px;">
                    <label class="left-aligned-label">5、题目分类（如：省级, 数学）：</label> <!-- 标签 -->
                    <input type="text" name="category" value="" required style="width: 100%; padding: 5px;"> <!-- 输入框 -->
                </div>
                <div style="margin-bottom: 10px;">
                    <label class="left-aligned-label">6、备注（答案解析）：</label> <!-- 标签 -->
                    <input type="text" name="beizhu" value="" style="width: 100%; padding: 5px;" autocomplete="off"> <!-- 输入框 -->
                </div>
                <button type="submit">提交</button> <!-- 提交按钮 -->
            </form>
        </div>

        <div id="challengeRecordContent" class="right-content hidden">
            <h3>挑战记录</h3> <!-- 挑战记录标题 -->
            <table id="challengeTable">
                <thead> <!--这是表格的头部部分，通常包含列标题（即表头单元格 <th>），用于描述每一列的数据类型或名称 -->
                <tr>     <!--在 <thead> 中，它包含了一组表头单元格 <th>，用于定义每列的标题 -->
                    <th>序号</th> <!-- 表头单元格 -->
                    <th>用户ID</th> <!-- 表头单元格 -->
                    <th>题目分类</th> <!-- 表头单元格 -->
                    <th>难度等级</th> <!-- 表头单元格 -->
                    <th>挑战分数</th> <!-- 表头单元格 -->
                    <th>挑战时间</th> <!-- 表头单元格 -->
                </tr>
                </thead>
                <tbody> <!--<tbody> 部分目前是空的，实际的数据行需要通过后端数据或 JavaScript 动态生成并插入到 <tbody> 中。 -->
                </tbody>
            </table>
        </div>

        <div id="wrongRecordContent" class="right-content hidden">
            <h2>错题记录</h2> <!-- 错题记录标题 -->
            <table id="wrongTable">
                <thead>
                <tr>
                    <th>用户ID</th> <!-- 表头单元格 -->
                    <th>题目ID</th> <!-- 表头单元格 -->
                    <th>错误次数</th> <!-- 表头单元格 -->
                </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>

        <!--独立撰写新功能 综合分析按钮-->
        <div id="analysisContent" class="hidden">
            <div class="right-content"> <!--个右侧内容区域的容器，可能用于布局页面的右侧部分 -->
                <div class="right-column" id="analysisColumn"> <!--影响h2里面格式 更具体的容器，用于显示“题目分类”相关的内容 -->
                    <h2>综合分析</h2> <!-- 这是一个二级标题，表示这部分内容的主题是“题目分类” -->
                    <div class="category-list">
                        {% for category in categories %} <!--一个容器，遍历 categories 列表中的每个分类的分类按钮 categoriesapp.py中以及定义-->
                        <!-- class="category-btn": 指定按钮的样式类,data-category 一个自定义属性，用于存储分类的名称 动态设置按钮的背景颜色，颜色值从 category_colors 字典中获取。category_colors 是一个映射分类名称到颜色的字典（例如 {"数学":
                         "red", "英语": "blue", "物理": "green"} data-category 属性，存储了分类的名称可以通过JavaScript 监听按钮的点击事件，获取分类名称并执行相应操作。-->
                        <button class="category-btn" data-category="{{ category }}" style="background-color: {{ category_colors[category] }};"> <!-- 循环生成每个类别的按钮 -->
                            {{ category }} <!--显示分类的名称（如 数学） -->
                        </button>
                        {% endfor %}
                    </div>
                </div>
                <div id="wrongRecordContent" class="right-content hidden">
                    <table id="wrongTable">
                        <thead>
                        <tr>
                            <th>用户ID</th> <!-- 表头单元格 -->
                            <th>重点ID</th> <!-- 表头单元格 -->
                            <th>重点</th> <!-- 表头单元格 -->
                        </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>



    </div>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script> <!-- 引入外部JS文件 -->
</body>
</html>
